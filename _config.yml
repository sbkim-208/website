# --- Site settings ---
title: Subin Kim
tagline: Master Student
description: >-
  Personal academic website — research, publications, and projects.
# Set this to your GitHub Pages URL. For a user site: https://<username>.github.io
# For a project site, also set baseurl: "/<repo-name>"
url: "https://sbkim-208.github.io"
baseurl: "/website"

# --- Profile (edit these) ---
author:
  name: Subin Kim
  bio: >-
    Master's student in Civil Engineering at the University of Michigan,
     keen to explore and pioneer ways in which data, connected technologies, 
     and automation can improve construction and transportation operations, 
    through greater efficiency, safety, and reliability.
  photo: /assets/img/profile.png
  email: sbkim208@gmail.com
  github: sbkim-208
  linkedin: subin-kim-7b13a9326
  scholar: XXXXXXXX          # Google Scholar user id (from &user=... in the URL)
  cv: /assets/cv.pdf

# --- Build settings ---
markdown: kramdown
highlighter: rouge
permalink: /projects/:name/

# Collections: drop a .md file in _projects/ to add a project.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Sort/exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache

plugins:
  - jekyll-feed
  - jekyll-seo-tag
